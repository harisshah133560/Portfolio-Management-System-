services:
  - type: web
    name: portfoliohub-backend
    env: node
    repo: .
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://your-frontend-domain.vercel.app
      - key: FRONTEND_URL
        value: https://your-frontend-domain.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.vercel.app
